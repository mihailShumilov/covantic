[package]
name = "covantic"
version = "0.1.0"
description = "AI Agent Insurance Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "covantic"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Shortens LOCK_EXPLOIT to 30s for a devnet demo. See constants.rs — it is a
# build-time feature precisely so no runtime configuration can reach it.
devnet-fast-lock = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
# Verifies Wormhole guardian signatures over Pyth price updates on chain.
# Tracks the anchor version: the 2.x line builds against anchor-lang 1.0.2,
# which is what this program uses. These two must move together — bumping one
# alone pulls two incompatible `solana-program` versions into the same binary,
# and the failure surfaces as a wall of "Pubkey: BorshSerialize is not
# satisfied" errors that say nothing about the real cause.
pyth-solana-receiver-sdk = "2.0.0"
# The envelope commitment a premium is quoted against. Anchor 1.x re-exports a
# curated subset of `solana_program` that omits `hash`, and this crate is what
# that module used to forward to — already in the lock file as a transitive
# dependency of solana-program, so it adds nothing to the build graph.
solana-sha256-hasher = "3.1.0"
