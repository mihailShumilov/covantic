[package]
name = "covantic"
version = "0.1.0"
description = "AI Agent Insurance Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "covantic"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
# Verifies Wormhole guardian signatures over Pyth price updates on chain.
# Tracks the anchor version: the 2.x line builds against anchor-lang 1.0.2,
# which is what this program uses. These two must move together — bumping one
# alone pulls two incompatible `solana-program` versions into the same binary,
# and the failure surfaces as a wall of "Pubkey: BorshSerialize is not
# satisfied" errors that say nothing about the real cause.
pyth-solana-receiver-sdk = "2.0.0"
