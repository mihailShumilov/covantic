<!DOCTYPE html>
<!--
  Covantic pitch deck — exported bundle, served at /pitch via a rewrite in next.config.ts.
  Two edits were applied to the export; re-apply them after re-exporting:
    1. <title> + description + favicon added inside the bundled template <head>.
       The unpacker replaces documentElement wholesale, so a <title> in the outer
       document is discarded — it has to live in the template.
    2. The two empty <image-slot> logo placeholders (slides 1 and 12) were replaced
       with the inline Covantic mark. Unfilled slots render a dashed "drop an image"
       target, which is correct in the authoring tool and wrong in public.
-->

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"background-color:#0A0C0F;background-image:linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);background-size:72px 72px;color:#E6EAF0;font-family:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box;\">\n  <div style=\"position:absolute;top:200px;left:50%;transform:translateX(-50%);width:1400px;height:560px;background:radial-gradient(ellipse at center,rgba(255,59,87,0.14),transparent 62%);pointer-events:none;\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:92px 120px 120px;display:flex;flex-direction:column;box-sizing:border-box;\">\n    <div data-enter=\"\" style=\"font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#3B82F6;font-weight:700;\">The loss<\u002Fdiv>\n    <div style=\"flex:1;display:flex;align-items:center;\">\n      <div data-enter=\"\" data-count=\"286000000\" data-count-group=\"\" data-count-pre=\"$\" data-count-final=\"$286,000,000\" style=\"font-size:184px;font-weight:800;letter-spacing:-6px;line-height:0.9;color:#FF3B57;font-variant-numeric:tabular-nums;\">$286,000,000<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <div data-enter=\"\" style=\"font-size:34px;color:#8A93A0;font-weight:400;\">Drift Protocol — drained. April 1, 2026.<\u002Fdiv>\n      <div data-enter=\"\" style=\"font-size:34px;color:#8A93A0;font-weight:400;\">Admin-key compromise. Autonomous agents had open positions.<\u002Fdiv>\n      <div data-enter=\"\" style=\"font-size:40px;color:#E6EAF0;font-weight:600;margin-top:6px;\">Their operators absorbed every cent. Nothing covered them.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:120px;bottom:52px;font-size:24px;letter-spacing:1px;color:#5A6472;\">covantic.org<\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;font-size:24px;letter-spacing:1px;color:#5A6472;\">02 / 12<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════ x;font-size:26px;color:#8A93A0;\">Building through both programs.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-enter=\"\" style=\"margin-top:26px;padding-top:24px;border-top:1px solid #1E2630;display:flex;gap:44px;font-size:24px;letter-spacing:1px;color:#5A6472;\">\n      <span>Anchor / Rust<\u002Fspan><span>Pyth<\u002Fspan><span>Helius<\u002Fspan><span>Solana Agent Kit<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:120px;bottom:52px;font-size:24px;letter-spacing:1px;color:#5A6472;\">covantic.org<\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;font-size:24px;letter-spacing:1px;color:#5A6472;\">11 / 12<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════ SLIDE 12 — TEAM, ASK & CLOSE ═══════════ -->\n<section data-label=\"Team &amp; ask\" data-screen-label=\"12\" data-speaker-notes=\"Pause 2s before the ask; 1s before the URL. Make it land like a landing, not a fade.\" style=\"background-color:#0A0C0F;background-image:linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);background-size:72px 72px;color:#E6EAF0;font-family:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box;\">\n  <div style=\"position:absolute;bottom:-240px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(circle,rgba(45,226,176,0.10),transparent 62%);pointer-events:none;\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:92px 120px 120px;display:flex;flex-direction:column;box-sizing:border-box;\">\n    <div data-enter=\"\" style=\"font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#3B82F6;font-weight:700;\">Team &amp; ask<\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:center;\">\n      <div data-enter=\"\">\n        <div style=\"font-size:54px;font-weight:800;\">Michael Shumilov<\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:24px;color:#2DE2B0;\">founder<\u002Fdiv>\n        <div style=\"margin-top:30px;font-size:29px;color:#8A93A0;line-height:1.45;max-width:640px;\">19 yrs software &amp; CTO — high-load real-time payments, marketplaces, finance &amp; risk systems.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-enter=\"\" style=\"border-left:1px solid #1E2630;padding-left:80px;\">\n        <div style=\"font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#5A6472;\">The ask<\u002Fdiv>\n        <div style=\"margin-top:22px;font-size:58px;font-weight:800;line-height:1.12;\">Raising <span style=\"color:#2DE2B0;\">$300K<\u002Fspan> pre-seed<\u002Fdiv>\n        <div style=\"margin-top:26px;font-size:28px;color:#8A93A0;line-height:1.5;\">Security audit + mainnet launch + first design-partner cohort.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-enter=\"\" style=\"display:flex;flex-direction:column;align-items:center;gap:20px;\">\n      <svg data-enter=\"\" width=\"84\" height=\"84\" viewBox=\"0 0 32 32\" aria-label=\"Covantic\"><circle cx=\"16\" cy=\"16\" r=\"12.5\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"5\"><\u002Fcircle><circle cx=\"16\" cy=\"16\" r=\"4\" fill=\"#E6EAF0\"><\u002Fcircle><\u002Fsvg>\n      <div style=\"display:flex;align-items:baseline;gap:20px;\">\n        <span style=\"font-size:40px;font-weight:800;\">Covantic<\u002Fspan>\n        <span style=\"font-size:24px;color:#2DE2B0;\">covantic.org<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:120px;bottom:52px;font-size:24px;letter-spacing:1px;color:#5A6472;\">12 / 12<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._anims = [];\n    this._timers = [];\n    this._intervals = [];\n    this._token = 0;\n    this._onChange = (e) => this._activate(e.detail && e.detail.slide);\n    document.addEventListener('slidechange', this._onChange);\n    // Press H or T to show/hide the left thumbnail sidebar (useful when presenting the standalone file).\n    try { this._railOn = localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { this._railOn = true; }\n    this._onKey = (e) => {\n      if (e.metaKey || e.ctrlKey || e.altKey) return;\n      const k = e.key;\n      if (k === 'h' || k === 'H' || k === 't' || k === 'T') {\n        this._railOn = !this._railOn;\n        try { window.postMessage({ type: '__deck_rail_visible', on: this._railOn }, '*'); } catch (err) {}\n      }\n    };\n    window.addEventListener('keydown', this._onKey);\n    // Fire for whatever slide is already active on mount.\n    const active = document.querySelector('section[data-deck-active]');\n    if (active) this._activate(active);\n  }\n  componentWillUnmount() {\n    this._clear();\n    document.removeEventListener('slidechange', this._onChange);\n    window.removeEventListener('keydown', this._onKey);\n  }\n  _clear() {\n    this._token++;\n    this._anims.forEach((a) => { try { a.cancel(); } catch (e) {} });\n    this._anims = [];\n    this._timers.forEach(clearTimeout); this._timers = [];\n    this._intervals.forEach(clearInterval); this._intervals = [];\n  }\n  _ease(t) { return 1 - Math.pow(1 - t, 3); }\n  _tween(dur, cb, done) {\n    const token = this._token, t0 = performance.now(), self = this;\n    function frame(now) {\n      if (self._token !== token) return;\n      const p = Math.min(1, (now - t0) / dur);\n      cb(self._ease(p));\n      if (p < 1) requestAnimationFrame(frame);\n      else if (done) done();\n    }\n    requestAnimationFrame(frame);\n  }\n  _activate(slide) {\n    this._clear();\n    if (!slide) return;\n    this._enter(slide);\n    const k = slide.getAttribute('data-anim') || '';\n    if (k.includes('count')) this._counters(slide);\n    if (k.includes('ticker')) this._ticker(slide);\n    if (k.includes('gauge')) this._gauge(slide);\n    if (k.includes('scan')) this._scan(slide);\n    if (k.includes('pipeline')) this._pipeline(slide);\n    if (k.includes('terminal')) this._terminal(slide);\n  }\n  _enter(slide) {\n    const els = Array.prototype.slice.call(slide.querySelectorAll('[data-enter]'));\n    els.forEach((el, i) => {\n      const a = el.animate(\n        [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }],\n        { duration: 520, delay: 90 + i * 70, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' }\n      );\n      this._anims.push(a);\n    });\n  }\n  _counters(slide) {\n    const els = Array.prototype.slice.call(slide.querySelectorAll('[data-count]'));\n    els.forEach((el) => {\n      const target = parseFloat(el.getAttribute('data-count'));\n      const dec = parseInt(el.getAttribute('data-count-dec') || '0', 10);\n      const pre = el.getAttribute('data-count-pre') || '';\n      const suf = el.getAttribute('data-count-suf') || '';\n      const grp = el.hasAttribute('data-count-group');\n      const finalTxt = el.getAttribute('data-count-final') || (pre + target + suf);\n      const fmt = (v) => {\n        let n = dec > 0 ? v.toFixed(dec) : Math.round(v).toString();\n        if (grp) n = Number(n).toLocaleString('en-US');\n        return pre + n + suf;\n      };\n      this._tween(1150, (p) => { el.textContent = fmt(target * p); }, () => { el.textContent = finalTxt; });\n    });\n  }\n  _ticker(slide) {\n    const el = slide.querySelector('[data-ticker]');\n    if (!el) return;\n    const target = parseFloat(el.getAttribute('data-ticker'));\n    const self = this, token = this._token;\n    this._tween(1400, (p) => { el.textContent = '$' + Math.round(target * p).toLocaleString('en-US'); }, () => {\n      let v = target;\n      const id = setInterval(() => {\n        if (self._token !== token) { clearInterval(id); return; }\n        v += Math.floor(Math.random() * 380 + 120);\n        el.textContent = '$' + v.toLocaleString('en-US');\n      }, 850);\n      self._intervals.push(id);\n    });\n  }\n  _gauge(slide) {\n    const arc = slide.querySelector('[data-gauge-arc]');\n    const num = slide.querySelector('[data-gauge-num]');\n    const C = 326.7, score = 0.182;\n    this._tween(1300, (p) => {\n      if (arc) arc.setAttribute('stroke-dashoffset', (C - C * score * p).toFixed(1));\n      if (num) num.textContent = (score * p).toFixed(3);\n    }, () => { if (num) num.textContent = '0.182'; if (arc) arc.setAttribute('stroke-dashoffset', (C - C * score).toFixed(1)); });\n  }\n  _scan(slide) {\n    const els = Array.prototype.slice.call(slide.querySelectorAll('[data-scan-val]'));\n    els.forEach((el, i) => {\n      const finalTxt = el.getAttribute('data-scan-val');\n      const color = el.getAttribute('data-scan-color') || '#2DE2B0';\n      el.textContent = '\\u00b7\\u00b7\\u00b7';\n      el.style.color = '#5A6472';\n      const t = setTimeout(() => { el.textContent = finalTxt; el.style.color = color; }, 650 + i * 240);\n      this._timers.push(t);\n    });\n  }\n  _pipeline(slide) {\n    const rail = slide.querySelector('[data-pipe-rail]');\n    if (rail) {\n      rail.style.transform = 'scaleX(0)';\n      this._anims.push(rail.animate(\n        [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],\n        { duration: 1300, easing: 'cubic-bezier(.4,.1,.2,1)', fill: 'backwards' }\n      ));\n    }\n    const nodes = Array.prototype.slice.call(slide.querySelectorAll('[data-pipe-node]'));\n    nodes.forEach((n, i) => {\n      const t = setTimeout(() => {\n        this._anims.push(n.animate(\n          [{ transform: 'scale(0.94)', filter: 'brightness(1)' }, { transform: 'scale(1.03)', filter: 'brightness(1.5)' }, { transform: 'scale(1)', filter: 'brightness(1)' }],\n          { duration: 520, easing: 'ease-out' }\n        ));\n      }, 200 + i * 300);\n      this._timers.push(t);\n    });\n  }\n  _termChev(el, mode) {\n    const p = el.hasAttribute('data-term-payout');\n    if (mode === 'pending') {\n      el.style.opacity = '0.35'; el.style.boxShadow = 'none';\n      el.style.borderColor = '#1E2630';\n      el.style.background = p ? 'rgba(45,226,176,0.05)' : '#10141A';\n      el.style.color = p ? 'rgba(45,226,176,0.6)' : '#8A93A0';\n    } else if (mode === 'current') {\n      el.style.opacity = '1'; el.style.borderColor = '#2DE2B0';\n      el.style.boxShadow = '0 0 28px rgba(45,226,176,0.32)';\n      el.style.background = p ? 'rgba(45,226,176,0.18)' : '#16202b';\n      el.style.color = p ? '#2DE2B0' : '#E6EAF0';\n    } else {\n      el.style.opacity = '1'; el.style.boxShadow = 'none';\n      el.style.borderColor = p ? '#2DE2B0' : '#1E2630';\n      el.style.background = p ? 'rgba(45,226,176,0.14)' : '#10141A';\n      el.style.color = p ? '#2DE2B0' : '#8A93A0';\n    }\n  }\n  _terminal(slide) {\n    const chevs = Array.prototype.slice.call(slide.querySelectorAll('[data-term-chev]'));\n    const lines = Array.prototype.slice.call(slide.querySelectorAll('[data-term-line]'));\n    chevs.forEach((c) => this._termChev(c, 'pending'));\n    lines.forEach((l) => { l.style.opacity = '0'; });\n    const token = this._token, self = this;\n    for (let i = 0; i < chevs.length; i++) {\n      (function (i) {\n        const t = setTimeout(() => {\n          if (self._token !== token) return;\n          for (let j = 0; j < i; j++) self._termChev(chevs[j], 'done');\n          self._termChev(chevs[i], 'current');\n          if (lines[i]) lines[i].style.opacity = '1';\n        }, 500 + i * 900);\n        self._timers.push(t);\n      })(i);\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
