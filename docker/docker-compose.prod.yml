# Production stack for Covantic — Hetzner VDS
# Usage: docker compose -f docker/docker-compose.prod.yml --env-file .env up -d

name: covantic

services:
  # PostgreSQL 18
  postgres:
    image: postgres:18
    container_name: covantic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covantic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-covantic}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U covantic']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: covantic-redis
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # Backend API (Fastify)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: covantic-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-covantic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-covantic}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALERT_HMAC_SECRET: ${ALERT_HMAC_SECRET:?ALERT_HMAC_SECRET is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      # Read-only fallbacks. Reads fail over across the primary plus these;
      # writes stay on the primary. Listed here for the same reason as the
      # proof flags: without an `env_file`, a variable absent from this block
      # never reaches the process, so setting it in .env would look like it
      # worked and change nothing.
      SOLANA_RPC_FALLBACK_URLS: ${SOLANA_RPC_FALLBACK_URLS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      HELIUS_WEBHOOK_BEARER: ${HELIUS_WEBHOOK_BEARER:-}
      SOLANA_RPC_FRESHNESS_AWARE: ${SOLANA_RPC_FRESHNESS_AWARE:-false}
      HELIUS_API_KEY: ${HELIUS_API_KEY}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET}
      PROGRAM_ID: ${PROGRAM_ID}
      # Settable, not hardcoded. Rotating the oracle authority on chain means
      # pointing the containers at the new key file, and a literal here made
      # the `.env` edit a no-op — the containers kept signing with a key the
      # program had already stopped accepting.
      ORACLE_KEYPAIR_PATH: ${ORACLE_KEYPAIR_PATH:-/app/keys/oracle-keypair.json}
      # The mint authority stays on the old, cold key. The oracle is hot: it
      # lives in these containers, and whoever holds the mint authority can
      # mint the covered asset outright.
      MINT_AUTHORITY_KEYPAIR_PATH: ${MINT_AUTHORITY_KEYPAIR_PATH:-}
      USDC_MINT: ${USDC_MINT}
      # Proof paths. Off until the program carrying the four verify_and_payout
      # instructions is deployed — enabling one against an older program makes
      # every payout on that trigger fail. They have to be listed here to be
      # settable at all: there is no `env_file`, so a variable that is not
      # named in this block never reaches the process, and setting it in .env
      # would look like it worked while changing nothing.
      ORACLE_PROOF_ENABLED: ${ORACLE_PROOF_ENABLED:-false}
      EXPLOIT_PROOF_ENABLED: ${EXPLOIT_PROOF_ENABLED:-false}
      GOVERNANCE_PROOF_ENABLED: ${GOVERNANCE_PROOF_ENABLED:-false}
      AGENT_ERROR_PROOF_ENABLED: ${AGENT_ERROR_PROOF_ENABLED:-false}
      # The public Hermes host answers 401 without a credential; unset, Pyth
      # simply drops out of the price consensus and says so in the bundle.
      PYTH_HERMES_URL: ${PYTH_HERMES_URL:-}
      PYTH_HERMES_API_KEY: ${PYTH_HERMES_API_KEY:-}
      # Sweep cadence. Two minutes is the production answer; a demo wants
      # seconds, because waiting two minutes for a claim to appear reads as a
      # detector that does not work. Short intervals cost SOL — every exploit
      # sweep writes an on-chain checkpoint the oracle wallet pays for.
      EXPLOIT_SWEEP_INTERVAL_MS: ${EXPLOIT_SWEEP_INTERVAL_MS:-120000}
      # Must match the deployed program's LOCK_EXPLOIT. Shorter and the chain
      # refuses the payout, the keeper records the revert as `failed`.
      EXPLOIT_LOCK_SECONDS: ${EXPLOIT_LOCK_SECONDS:-}
      AGENT_ERROR_LOCK_SECONDS: ${AGENT_ERROR_LOCK_SECONDS:-}
      AUTO_PAYOUT_HOURLY_LIMIT_RAW: ${AUTO_PAYOUT_HOURLY_LIMIT_RAW:-}
      ORACLE_SWEEP_INTERVAL_MS: ${ORACLE_SWEEP_INTERVAL_MS:-120000}
      PORT: 4000
      LOG_LEVEL: info
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Transaction Monitor
  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitor
    container_name: covantic-monitor
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-covantic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-covantic}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALERT_HMAC_SECRET: ${ALERT_HMAC_SECRET:?ALERT_HMAC_SECRET is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      # Read-only fallbacks. Reads fail over across the primary plus these;
      # writes stay on the primary. Listed here for the same reason as the
      # proof flags: without an `env_file`, a variable absent from this block
      # never reaches the process, so setting it in .env would look like it
      # worked and change nothing.
      SOLANA_RPC_FALLBACK_URLS: ${SOLANA_RPC_FALLBACK_URLS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      HELIUS_WEBHOOK_BEARER: ${HELIUS_WEBHOOK_BEARER:-}
      SOLANA_RPC_FRESHNESS_AWARE: ${SOLANA_RPC_FRESHNESS_AWARE:-false}
      HELIUS_API_KEY: ${HELIUS_API_KEY}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET}
      PROGRAM_ID: ${PROGRAM_ID}
      # Settable, not hardcoded. Rotating the oracle authority on chain means
      # pointing the containers at the new key file, and a literal here made
      # the `.env` edit a no-op — the containers kept signing with a key the
      # program had already stopped accepting.
      ORACLE_KEYPAIR_PATH: ${ORACLE_KEYPAIR_PATH:-/app/keys/oracle-keypair.json}
      # The mint authority stays on the old, cold key. The oracle is hot: it
      # lives in these containers, and whoever holds the mint authority can
      # mint the covered asset outright.
      MINT_AUTHORITY_KEYPAIR_PATH: ${MINT_AUTHORITY_KEYPAIR_PATH:-}
      USDC_MINT: ${USDC_MINT}
      # Proof paths. Off until the program carrying the four verify_and_payout
      # instructions is deployed — enabling one against an older program makes
      # every payout on that trigger fail. They have to be listed here to be
      # settable at all: there is no `env_file`, so a variable that is not
      # named in this block never reaches the process, and setting it in .env
      # would look like it worked while changing nothing.
      ORACLE_PROOF_ENABLED: ${ORACLE_PROOF_ENABLED:-false}
      EXPLOIT_PROOF_ENABLED: ${EXPLOIT_PROOF_ENABLED:-false}
      GOVERNANCE_PROOF_ENABLED: ${GOVERNANCE_PROOF_ENABLED:-false}
      AGENT_ERROR_PROOF_ENABLED: ${AGENT_ERROR_PROOF_ENABLED:-false}
      # The public Hermes host answers 401 without a credential; unset, Pyth
      # simply drops out of the price consensus and says so in the bundle.
      PYTH_HERMES_URL: ${PYTH_HERMES_URL:-}
      PYTH_HERMES_API_KEY: ${PYTH_HERMES_API_KEY:-}
      # Sweep cadence. Two minutes is the production answer; a demo wants
      # seconds, because waiting two minutes for a claim to appear reads as a
      # detector that does not work. Short intervals cost SOL — every exploit
      # sweep writes an on-chain checkpoint the oracle wallet pays for.
      EXPLOIT_SWEEP_INTERVAL_MS: ${EXPLOIT_SWEEP_INTERVAL_MS:-120000}
      # Must match the deployed program's LOCK_EXPLOIT. Shorter and the chain
      # refuses the payout, the keeper records the revert as `failed`.
      EXPLOIT_LOCK_SECONDS: ${EXPLOIT_LOCK_SECONDS:-}
      AGENT_ERROR_LOCK_SECONDS: ${AGENT_ERROR_LOCK_SECONDS:-}
      AUTO_PAYOUT_HOURLY_LIMIT_RAW: ${AUTO_PAYOUT_HOURLY_LIMIT_RAW:-}
      ORACLE_SWEEP_INTERVAL_MS: ${ORACLE_SWEEP_INTERVAL_MS:-120000}
      LOG_LEVEL: info
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Autonomous agent fleet runner. Its own image rather than the api one: it
  # runs a TypeScript file through `tsx`, so it needs devDependencies the api
  # image now prunes — and it is the least-trusted process in the stack, which
  # is a poor thing to share an image with the claim keeper. Read-only mount on
  # ./keys so the container can sign as the holder + per-agent keypairs.
  # Guarded against mainnet-beta inside the script, not via NODE_ENV.
  fleet:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fleet
    image: covantic-fleet:latest
    container_name: covantic-fleet
    environment:
      NODE_ENV: production
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      # Read-only fallbacks. Reads fail over across the primary plus these;
      # writes stay on the primary. Listed here for the same reason as the
      # proof flags: without an `env_file`, a variable absent from this block
      # never reaches the process, so setting it in .env would look like it
      # worked and change nothing.
      SOLANA_RPC_FALLBACK_URLS: ${SOLANA_RPC_FALLBACK_URLS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      HELIUS_WEBHOOK_BEARER: ${HELIUS_WEBHOOK_BEARER:-}
      SOLANA_RPC_FRESHNESS_AWARE: ${SOLANA_RPC_FRESHNESS_AWARE:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      USDC_MINT: ${USDC_MINT}
      # A public key, so this container needs no oracle secret. Set
      # FLEET_SINK_ADDRESS and the ./keys mount below can drop to ./keys/fleet.
      FLEET_SINK_ADDRESS: ${FLEET_SINK_ADDRESS:-}
      # Settable, not hardcoded. Rotating the oracle authority on chain means
      # pointing the containers at the new key file, and a literal here made
      # the `.env` edit a no-op — the containers kept signing with a key the
      # program had already stopped accepting.
      ORACLE_KEYPAIR_PATH: ${ORACLE_KEYPAIR_PATH:-/app/keys/oracle-keypair.json}
      # The mint authority stays on the old, cold key. The oracle is hot: it
      # lives in these containers, and whoever holds the mint authority can
      # mint the covered asset outright.
      MINT_AUTHORITY_KEYPAIR_PATH: ${MINT_AUTHORITY_KEYPAIR_PATH:-}
      PROGRAM_ID: ${PROGRAM_ID}
      LOG_LEVEL: info
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  # Frontend (Next.js)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL}
        NEXT_PUBLIC_PROGRAM_ID: ${PROGRAM_ID}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
    container_name: covantic-web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    networks:
      - internal

  # Nginx reverse proxy + SSL
  nginx:
    image: nginx:alpine
    container_name: covantic-nginx
    # Reload every 6h so certbot-renewed certs (written to the certbot-etc
    # volume) get picked up automatically. `certbot renew` has no deploy hook
    # to signal this container, so without this loop nginx keeps serving the
    # stale cert from memory until a manual restart -> TLS expiry outage.
    command: /bin/sh -c "trap exit TERM; while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - internal

  # Certbot for SSL renewal
  certbot:
    image: certbot/certbot
    container_name: covantic-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  certbot-etc:
  certbot-var:
  webroot:

networks:
  internal:
    driver: bridge
